<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BiteCraft</title>
  <link rel="stylesheet" href="new.css">
</head>

<body>

  <!-- Background Wrapper to catch the global linear gradient -->
  <main class="login-wrapper">

    <!-- Link back to home page -->
    <a href="index.html" class="back-home-btn">← Back to Menu</a>

    <!-- Main Card Container -->
    <section class="login-card">

      <!-- Header Area -->
      <div class="login-header">
        <h2>food<span>shop</span></h2>
        <p>Welcome back! Please login to your account.</p>
      </div>

      <!-- Form Inputs -->
      <form class="login-form" onsubmit="event.preventDefault();">

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="enter your email" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <div class="forgot-link">
            <a href="#">Forgot Password?</a>
          </div>
        </div>

        <!-- Reusing your optimized button layout -->
        <button type="submit" class="submit-btn">Sign In</button>

      </form>

      <!-- Alternate Action -->
      <div class="login-footer">
        <p>Don't have an account? <a href="#">Create one here</a></p>
      </div>

    </section>
  </main>

</body>

</html>
