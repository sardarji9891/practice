<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>food shopt</title>
  <link rel="stylesheet" href="new.css">
</head>

<body>
  <main class="loginWrapper">


    <a href="index.html" class="backHomeBtn">← Back to Menu</a>

    <section class="loginCard">


      <div class="loginHeader">
        <h2>food<span>shop</span></h2>
        <p>Welcome back! Please login to your account.</p>
      </div>


      <form class="loginForm" onsubmit="event.preventDefault();">

        <div class="inputGroup">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="enter your email" required autocomplete="email">
        </div>

        <div class="inputGroup">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <div class="forgotLink">
            <a href="#">Forgot Password?</a>
          </div>
        </div>
        <button type="submit" class="submitBtn">Sign In</button>
      </form>
      <div class="loginFooter">
        <p>Don't have an account? <a href="signup.html">Create here</a></p>
      </div>

    </section>
  </main>

</body>

</html>
